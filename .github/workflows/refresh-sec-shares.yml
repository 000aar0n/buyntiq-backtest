name: Refresh SEC historical share cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eligibility.py'
      - 'scripts/refresh_sec_shares.py'
      - '.github/workflows/refresh-sec-shares.yml'
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

concurrency:
  group: sec-share-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests before publishing
        run: python -m pytest -q tests
      - name: Refresh official dated SEC filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "Set SEC_USER_AGENT repository secret with project name and contact email to improve SEC access."
            export SEC_USER_AGENT="BuyntiqBacktest research github.com/000aar0n/buyntiq-backtest"
          fi
          python -u scripts/refresh_sec_shares.py
      - name: Commit verified history bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec_shares.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified SEC dated-share-count snapshot"
            git push
          else
            echo "No SEC cache changes"
          fi
